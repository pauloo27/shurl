# Valkey is shurl's primary database. Official image replaces the Bitnami
# chart (bitnami/valkey:8.0.2 tags were deleted upstream).
# Same names and the same PVC as the old chart: shurl config is unchanged.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shurl-valkey-dev-primary
  labels:
    app.kubernetes.io/name: shurl-valkey-dev
spec:
  replicas: 1
  serviceName: shurl-valkey-dev-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: shurl-valkey-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shurl-valkey-dev
    spec:
      securityContext:
        # The data files were written by Bitnami's user 1001.
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:8.1.11@sha256:8f836008e0986c36adf50da714c7060cf689dbb335f61fe077939d90fa650809
          args:
            - --dir
            - /data
            - --appendonly
            - "yes"
            - --save
            - ""
            - --protected-mode
            - "no"
            - --rename-command
            - FLUSHDB
            - ""
            - --rename-command
            - FLUSHALL
            - ""
          ports:
            - name: valkey
              containerPort: 6379
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: valkey-data
              mountPath: /data
      volumes:
        - name: valkey-data
          persistentVolumeClaim:
            claimName: valkey-data-valkey-primary-0
---
apiVersion: v1
kind: Service
metadata:
  name: shurl-valkey-dev-primary
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shurl-valkey-dev
  ports:
    - name: tcp-valkey
      port: 6379
      targetPort: valkey
---
apiVersion: v1
kind: Service
metadata:
  name: shurl-valkey-dev-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: shurl-valkey-dev
  ports:
    - name: tcp-valkey
      port: 6379
      targetPort: valkey
