image:
  tag: master

imageUpdater:
  enabled: true
  images:
    shurl:
      imageName: "code.db.cafe/pauloo27/shurl:master"
      updateStrategy: "digest"
      namePattern: "shurl-prod"
  writeBackMethod: "argocd"

externalSecrets:
  shurl-config-secret:
    data:
      - secretKey: config.yaml
        sourceRef:
          storeRef:
            name: openbao
            kind: ClusterSecretStore
        remoteRef:
          key: shurl/shurl-config-secret
          property: config.yaml

istio:
  enabled: true
  host: url.db.cafe
