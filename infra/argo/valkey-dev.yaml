apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shurl-valkey-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://code.db.cafe/pauloo27/shurl.git
    targetRevision: master
    path: infra/valkey/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: shurl-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
